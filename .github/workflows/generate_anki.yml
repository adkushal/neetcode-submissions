name: Generate Anki Deck

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deck Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_deck.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .card_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update card cache [skip ci]" && git push)

      - name: Publish Deck Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-deck
          name: "Latest NeetCode Deck"
          files: neetcode.apkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}